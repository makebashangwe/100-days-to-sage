<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href = "style.css">
  <title>Keba Builder Console</title>
</head>

<body>
    <header>
        <h1>Keba Builder Console</h1>
    </header>
    <main>
        <section>
            <h2> Status: </h2>
            <p id="status-display">Idle</p>
        </section>

        <section>
            <button id="start-button">Start</button>
            <button id="power-button">Idle</button>
            <button id="count-button">Count</button>
            
            <p>Completed Builds: <span id="completed-builds">0</span></p>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
